<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÀSÌKÒ Atelier // Try On</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { base: '#FBF9F6', deep: '#0D2A22', accent: '#D4AF37' },
                    },
                    fontFamily: {
                        display: ['"Playfair Display"', 'Georgia', 'serif'],
                        sans: ['"Inter"', 'system-ui', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body class="bg-brand-base min-h-screen font-sans text-brand-deep">

    <!-- Top nav bar -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-brand-base/90 backdrop-blur-md border-b border-brand-deep/5">
        <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
            <a href="/" class="font-display text-lg tracking-wide text-brand-deep">ÀSÌKÒ</a>
            <div class="flex items-center gap-3">
                <span class="text-xs font-mono text-brand-deep/40">3D Try-On</span>
                <a href="/" class="text-xs text-brand-deep/60 hover:text-brand-deep transition-colors">Back to Shop</a>
            </div>
        </div>
    </header>

    <main class="pt-14 min-h-screen">
        <div class="max-w-7xl mx-auto px-4 py-6">

            <!-- Gender toggle -->
            <div class="flex items-center gap-2 mb-4" x-data="{ gender: 'female' }">
                <button @click="gender='female'; if(window.__tryOnEngine) window.__tryOnEngine.loadAvatar('female')"
                        :class="gender === 'female' ? 'bg-brand-deep text-brand-base' : 'bg-brand-deep/5 text-brand-deep/60'"
                        class="px-3 py-1 text-xs font-medium rounded-full transition-all">
                    Female
                </button>
                <button @click="gender='male'; if(window.__tryOnEngine) window.__tryOnEngine.loadAvatar('male')"
                        :class="gender === 'male' ? 'bg-brand-deep text-brand-base' : 'bg-brand-deep/5 text-brand-deep/60'"
                        class="px-3 py-1 text-xs font-medium rounded-full transition-all">
                    Male
                </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

                <!-- 3D Viewer (2/3 width) -->
                <div class="lg:col-span-2 relative bg-white border border-brand-deep/10 min-h-[500px] lg:min-h-[600px] overflow-hidden rounded-lg"
                     id="tryon-canvas-wrap">

                    <!-- Loading overlay -->
                    <div id="tryon-loader" class="absolute inset-0 flex items-center justify-center bg-brand-base z-30 transition-opacity duration-500">
                        <div class="flex flex-col items-center gap-3">
                            <div class="w-5 h-5 border border-brand-deep/30 border-t-brand-accent rounded-full animate-spin"></div>
                            <span class="text-xs font-mono text-brand-deep/40 tracking-widest uppercase">Loading 3D view...</span>
                        </div>
                    </div>

                    <canvas id="tryon-canvas" class="w-full h-full block absolute inset-0"></canvas>

                    <!-- Zoom controls -->
                    <div class="absolute bottom-4 right-4 flex flex-col gap-1 z-20">
                        <button onclick="if(window.__tryOnEngine) window.__tryOnEngine.zoomIn()"
                                class="w-8 h-8 flex items-center justify-center bg-brand-deep text-brand-base hover:bg-brand-accent hover:text-brand-deep text-sm font-light transition-all rounded">
                            +
                        </button>
                        <button onclick="if(window.__tryOnEngine) window.__tryOnEngine.zoomOut()"
                                class="w-8 h-8 flex items-center justify-center bg-brand-deep text-brand-base hover:bg-brand-accent hover:text-brand-deep text-sm font-light transition-all rounded">
                            −
                        </button>
                        <button onclick="if(window.__tryOnEngine) window.__tryOnEngine.resetView()"
                                class="w-8 h-8 flex items-center justify-center bg-brand-deep/10 text-brand-deep hover:bg-brand-deep hover:text-brand-base text-xs transition-all rounded mt-1">
                            ↺
                        </button>
                    </div>

                    <!-- Current garment label -->
                    <div class="absolute top-4 left-4 z-20" x-data="{ name: 'No garment selected' }"
                         x-init="$watch('$store.tryOn.currentGarmentName', v => name = v)"
                         x-show="name !== 'No garment selected'">
                        <div class="bg-brand-base/90 backdrop-blur-sm px-3 py-1.5 rounded-lg border border-brand-accent/20">
                            <span class="text-xs font-medium text-brand-deep" x-text="name"></span>
                        </div>
                    </div>
                </div>

                <!-- Product panel (1/3 width) -->
                <div class="space-y-4" id="product-panel">

                    <!-- Product card from URL or HTMX loaded -->
                    <div id="tryon-product-info"
                         hx-get="{{ product_info_url }}"
                         hx-trigger="load"
                         hx-swap="innerHTML">
                        <div class="bg-white rounded-lg border border-brand-deep/10 p-4 animate-pulse h-48"></div>
                    </div>

                    <!-- Browse collection -->
                    <div class="bg-white rounded-lg border border-brand-deep/10 p-4">
                        <h3 class="text-xs font-mono uppercase tracking-widest text-brand-deep/40 mb-3">Browse Collection</h3>
                        <div id="tryon-product-list"
                             hx-get="/tryon/product-list"
                             hx-trigger="load"
                             hx-swap="innerHTML">
                            <div class="space-y-2 animate-pulse">
                                <div class="h-12 bg-brand-deep/5 rounded"></div>
                                <div class="h-12 bg-brand-deep/5 rounded"></div>
                                <div class="h-12 bg-brand-deep/5 rounded"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Action buttons -->
                    <div class="space-y-2">
                        <button id="add-to-bag-btn"
                                hx-post="/cart/add"
                                hx-vals='{}'
                                hx-swap="none"
                                class="w-full py-3 bg-brand-deep text-brand-base font-medium text-sm rounded-lg hover:bg-brand-accent hover:text-brand-deep transition-all disabled:opacity-40"
                                disabled>
                            Add to Bag
                        </button>
                        <a href="/cart" class="block text-center text-xs text-brand-deep/50 hover:text-brand-deep transition-colors">
                            View Shopping Bag →
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Alpine.js store for try-on state -->
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.store('tryOn', {
                currentProduct: null,
                currentGarmentName: 'No garment selected',
                currentGarmentPrice: 0,
                currentGender: 'female',
            });
        });
    </script>

    <!-- Three.js engine -->
    <script type="module">
        import { initTryOnEngine } from '/static/js/atelier-3d.js?v={{ range(1000, 9999) | random }}';

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('tryon-canvas-wrap');
            if (!container) return;

            const engine = initTryOnEngine(container);
            window.__tryOnEngine = engine;

            // Load default avatar
            engine.loadAvatar('female');

            // Hide loader after a short delay
            setTimeout(() => {
                const loader = document.getElementById('tryon-loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                }
            }, 1500);

            // Listen for garment selection events
            document.addEventListener('tryon-load-garment', (e) => {
                const { url, name, price, productId } = e.detail;
                engine.loadGarment(url);
                Alpine.store('tryOn').currentGarmentName = name;
                Alpine.store('tryOn').currentGarmentPrice = price;
                Alpine.store('tryOn').currentProduct = { id: productId, name, price };

                // Enable add to bag
                const btn = document.getElementById('add-to-bag-btn');
                if (btn) {
                    btn.disabled = false;
                    btn.setAttribute('hx-vals', JSON.stringify({ product_id: productId }));
                }
            });
        });
    </script>

    <!-- Failsafe loader clear -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(function() {
                var loader = document.getElementById('tryon-loader');
                if (loader && loader.style.display !== 'none') {
                    loader.style.opacity = '0';
                    setTimeout(function() { loader.style.display = 'none'; }, 500);
                }
            }, 3000);
        });
    </script>
</body>
</html>
