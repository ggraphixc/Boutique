<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if product and product.model_3d_url %}{{ product.name }} — 3D Try-On{% else %}3D Try-On{% endif %} — ASIKO Boutique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { base: '#FBF9F6', deep: '#0D2A22', accent: '#D4AF37' },
                    },
                    fontFamily: {
                        display: ['"Playfair Display"', 'Georgia', 'serif'],
                        sans: ['"Inter"', 'system-ui', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body class="bg-[#FBF9F6] min-h-screen font-sans text-[#0D2A22]"
      x-data="tryOnApp()"
      x-init="init()">

    <header class="fixed top-0 left-0 right-0 z-50 bg-[#FBF9F6]/90 backdrop-blur-md border-b border-[#0D2A22]/5">
        <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
            <a href="/" class="font-display text-lg tracking-wide text-[#0D2A22]">ASIKO</a>
            <div class="flex items-center gap-3">
                <span class="text-xs font-mono text-[#0D2A22]/40">3D Try-On</span>
                <a href="/" class="text-xs text-[#0D2A22]/60 hover:text-[#0D2A22] transition-colors">Back to Shop</a>
            </div>
        </div>
    </header>

    <main class="pt-14 min-h-screen" @tryon-load-garment.window="loadProduct($event.detail)">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <!-- Mobile: product info drawer toggle -->
            <div class="flex lg:hidden items-center justify-between mb-3">
                <h2 class="font-mono text-xs uppercase tracking-wider text-[#0D2A22]/60" x-text="current.name || 'Select a product'"></h2>
                <button @click="showPanel = !showPanel" class="px-3 py-1.5 text-xs font-mono uppercase tracking-wider bg-[#0D2A22] text-[#FBF9F6] rounded-lg">
                    <span x-text="showPanel ? 'Hide' : 'Details'"></span>
                </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

                <!-- 3D Viewer (2/3 width) -->
                <div class="lg:col-span-2 relative bg-white border border-[#0D2A22]/10 min-h-[70vh] lg:min-h-[600px] overflow-hidden rounded-lg">

                    <model-viewer
                        x-bind:src="current.model_3d_url"
                        x-bind:alt="current.name"
                        x-bind:poster="current.base_image"
                        camera-controls
                        auto-rotate
                        rotation-per-second="30deg"
                        shadow-intensity="1"
                        exposure="1.2"
                        environment-image="neutral"
                        style="width: 100%; height: 100%; min-height: 70vh; --poster-color: transparent;"
                        loading="eager"
                        reveal="auto"
                    >
                        <div slot="progress-bar" class="hidden"></div>
                        <button slot="ar-button" class="absolute bottom-4 left-4 z-10 px-4 py-2 bg-[#0D2A22]/80 text-[#FBF9F6] text-xs font-mono uppercase tracking-wider rounded-lg hover:bg-[#D4AF37] hover:text-[#0D2A22] transition-all backdrop-blur-sm">
                            View in AR
                        </button>
                        <div slot="poster" class="w-full h-full flex items-center justify-center bg-neutral-100">
                            <template x-if="current.base_image">
                                <img x-bind:src="current.base_image" x-bind:alt="current.name" class="w-full h-full object-contain p-8">
                            </template>
                            <template x-if="!current.base_image">
                                <span class="text-6xl font-display text-[#0D2A22]/20">A</span>
                            </template>
                        </div>
                    </model-viewer>

                    <div class="absolute top-3 left-3 z-10">
                        <template x-if="!current.model_3d_url">
                            <span class="px-2.5 py-1 rounded-lg bg-amber-50 border border-amber-200 text-amber-800 text-[10px] font-mono uppercase tracking-wider">
                                3D model not available
                            </span>
                        </template>
                    </div>

                    <!-- Loading overlay -->
                    <div id="mv-loader" x-show="loading3d" x-cloak
                         class="absolute inset-0 flex items-center justify-center bg-[#FBF9F6]/90 z-20 transition-opacity duration-500">
                        <div class="flex flex-col items-center gap-3">
                            <div class="w-5 h-5 border border-[#0D2A22]/30 border-t-[#D4AF37] rounded-full animate-spin"></div>
                            <span class="text-xs font-mono text-[#0D2A22]/40 tracking-widest uppercase">Loading 3D model...</span>
                        </div>
                    </div>
                </div>

                <!-- Product panel (1/3 width) -->
                <div class="space-y-4" x-bind:class="showPanel ? 'block' : 'hidden lg:block'">

                    <!-- Product card -->
                    <template x-if="current.id">
                        <div class="bg-white rounded-lg border border-[#0D2A22]/10 p-5 space-y-4">
                            <template x-if="current.base_image">
                                <img x-bind:src="current.base_image" x-bind:alt="current.name" class="w-full h-36 object-cover rounded-lg">
                            </template>
                            <div>
                                <h2 class="font-display text-xl text-[#0D2A22]" x-text="current.name"></h2>
                                <p class="font-mono text-lg text-[#D4AF37] tracking-wider mt-1" x-html="current.price_fmt"></p>
                            </div>
                            <p class="text-sm text-[#0D2A22]/60 leading-relaxed" x-text="current.description_short"></p>
                            <div class="text-xs font-mono uppercase tracking-wider">
                                <template x-if="current.stock === 0">
                                    <span class="text-red-600">Sold out</span>
                                </template>
                                <template x-if="current.stock > 0 && current.stock <= 5">
                                    <span class="text-amber-700" x-text="'Only ' + current.stock + ' left'"></span>
                                </template>
                                <template x-if="current.stock > 5">
                                    <span class="text-emerald-700">In stock</span>
                                </template>
                            </div>
                            <button
                                hx-post="/cart/add"
                                hx-vals='{"product_id": "", "quantity": 1}'
                                hx-swap="none"
                                @click="$event.target.setAttribute('hx-vals', JSON.stringify({product_id: current.id, quantity: 1}))"
                                class="w-full py-3 bg-[#0D2A22] text-[#FBF9F6] font-medium text-sm rounded-lg hover:bg-[#D4AF37] hover:text-[#0D2A22] transition-all">
                                Add to Bag
                            </button>
                            <a x-bind:href="'/product/' + current.id" class="block text-center text-xs text-[#0D2A22]/50 hover:text-[#0D2A22] transition-colors">
                                View Product Details →
                            </a>
                        </div>
                    </template>
                    <template x-if="!current.id">
                        <div class="bg-white rounded-lg border border-[#0D2A22]/10 p-4 text-center text-xs text-[#0D2A22]/40">
                            Select a product to try on.
                        </div>
                    </template>

                    <!-- Browse collection -->
                    <div class="bg-white rounded-lg border border-[#0D2A22]/10 p-4">
                        <h3 class="text-xs font-mono uppercase tracking-widest text-[#0D2A22]/40 mb-3">Browse Collection</h3>
                        <div id="tryon-product-list"
                             hx-get="/tryon/product-list"
                             hx-trigger="load"
                             hx-swap="innerHTML">
                            <div class="space-y-2 animate-pulse">
                                <div class="h-12 bg-[#0D2A22]/5 rounded"></div>
                                <div class="h-12 bg-[#0D2A22]/5 rounded"></div>
                                <div class="h-12 bg-[#0D2A22]/5 rounded"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function tryOnApp() {
            return {
                current: {
                    id: '{{ product.id if product else "" }}',
                    name: '{{ product.name if product else "" }}',
                    price: {{ product.price if product and product.price else 0 }},
                    price_fmt: '{{ ("&#8358;" + "{:,}".format(product.price | int)) if product and product.price else "" }}',
                    description_short: '{{ (product.description[:150] + ("..." if product.description|length > 150 else "")) if product and product.description else "" }}',
                    base_image: '{{ product.base_image if product and product.base_image else "" }}',
                    model_3d_url: '{{ product.model_3d_url if product and product.model_3d_url else "" }}',
                    stock: {{ product.stock_quantity if product and product.stock_quantity is defined else 0 }},
                },
                showPanel: true,
                loading3d: false,

                init() {
                    // Watch model-viewer load events
                    const mv = document.querySelector('model-viewer');
                    if (mv) {
                        mv.addEventListener('load', () => { this.loading3d = false; });
                        mv.addEventListener('preload', () => { this.loading3d = true; });
                    }
                    // If we have a 3D model, show loader
                    if (this.current.model_3d_url) {
                        this.loading3d = true;
                        // Failsafe: hide loader after 10s
                        setTimeout(() => { this.loading3d = false; }, 10000);
                    }
                },

                loadProduct(product) {
                    this.current = {
                        id: product.productId || '',
                        name: product.name || '',
                        price: product.price || 0,
                        price_fmt: product.price ? '&#8358;' + Number(product.price).toLocaleString() : '',
                        description_short: (product.description || '').slice(0, 150),
                        base_image: product.base_image || '',
                        model_3d_url: product.url || '',
                        stock: product.stock || 0,
                    };
                    this.showPanel = true;
                    this.loading3d = true;
                    // Failsafe: hide loader after 10s
                    setTimeout(() => { this.loading3d = false; }, 10000);
                },
            };
        }
    </script>
</body>
</html>
