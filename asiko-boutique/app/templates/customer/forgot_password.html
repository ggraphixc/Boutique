{% extends "base.html" %}
{% block title %}Forgot Password — ASIKO Boutique{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="bg-white dark:bg-[#111114] rounded-2xl border border-[#D4AF37]/20 dark:border-gray-800 shadow-lg p-8">
      <div class="text-center mb-6">
        <h1 class="font-display text-2xl text-[#0D2A22] dark:text-[#D4AF37]">Forgot Password</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Enter your email and we&rsquo;ll send you a reset link.</p>
      </div>
      {% if error %}
      <div class="mb-4 p-3 rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-sm text-red-700 dark:text-red-400">{{ error }}</div>
      {% endif %}
      {% if success %}
      <div class="mb-4 p-3 rounded-lg bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800 text-sm text-emerald-700 dark:text-emerald-400">{{ success }}</div>
      {% endif %}
      <form method="POST" action="/forgot-password" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-200 mb-1.5">Email address</label>
          <input type="email" name="email" required placeholder="you@example.com"
                 class="w-full text-sm border border-gray-200 dark:border-gray-800 rounded-lg px-3 py-2.5 bg-white dark:bg-[#0E0E10] focus:outline-none focus:ring-2 focus:ring-[#D4AF37]/40">
        </div>
        <button type="submit" class="w-full bg-[#0D2A22] dark:bg-[#D4AF37] dark:text-[#0D2A22] text-white font-semibold py-2.5 rounded-lg hover:opacity-90 transition">Send Reset Link</button>
      </form>
      <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-4">
        <a href="/login" class="text-[#D4AF37] hover:underline">Back to Sign In</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
