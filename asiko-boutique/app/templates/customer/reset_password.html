{% extends "base.html" %}
{% block title %}Reset Password — ASIKO Boutique{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4" x-data="{ show: false, showConfirm: false }">
  <div class="w-full max-w-md">
    <div class="bg-white dark:bg-[#111114] rounded-2xl border border-[#D4AF37]/20 dark:border-gray-800 shadow-lg p-8">
      <div class="text-center mb-6">
        <h1 class="font-display text-2xl text-[#0D2A22] dark:text-[#D4AF37]">Set New Password</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Choose a strong password for your account.</p>
      </div>
      {% if error %}
      <div class="mb-4 p-3 rounded-lg bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-sm text-red-700 dark:text-red-400">{{ error }}</div>
      {% endif %}
      <form method="POST" action="/reset-password" class="space-y-4">
        <input type="hidden" name="token" value="{{ token }}">
        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-200 mb-1.5">New Password</label>
          <div class="relative">
            <input :type="show ? 'text' : 'password'" name="password" required minlength="6" placeholder="Min. 6 characters"
                   class="w-full text-sm border border-gray-200 dark:border-gray-800 rounded-lg px-3 py-2.5 pr-10 bg-white dark:bg-[#0E0E10] focus:outline-none focus:ring-2 focus:ring-[#D4AF37]/40">
            <button type="button" @click="show = !show" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
              <svg x-show="!show" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <svg x-show="show" x-cloak class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
            </button>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-200 mb-1.5">Confirm Password</label>
          <div class="relative">
            <input :type="showConfirm ? 'text' : 'password'" name="confirm_password" required minlength="6" placeholder="Re-enter password"
                   class="w-full text-sm border border-gray-200 dark:border-gray-800 rounded-lg px-3 py-2.5 pr-10 bg-white dark:bg-[#0E0E10] focus:outline-none focus:ring-2 focus:ring-[#D4AF37]/40">
            <button type="button" @click="showConfirm = !showConfirm" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
              <svg x-show="!showConfirm" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <svg x-show="showConfirm" x-cloak class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="w-full bg-[#0D2A22] dark:bg-[#D4AF37] dark:text-[#0D2A22] text-white font-semibold py-2.5 rounded-lg hover:opacity-90 transition">Reset Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
