<!-- Real-time review stats fragment (swapped via WS trigger) -->
<div id="rt-review-stats" class="grid grid-cols-1 md:grid-cols-4 gap-5">
    <div class="bg-white dark:bg-[#111114] rounded-xl border border-gray-200 dark:border-gray-800 p-5">
        <div class="text-xs text-gray-500 dark:text-gray-400 dark:text-gray-500 uppercase tracking-wider font-semibold">Average rating</div>
        <div class="mt-2 flex items-baseline gap-1.5">
            <span class="text-3xl font-semibold text-gray-900 dark:text-gray-100">{{ rating_avg or '—' }}</span>
            <span class="text-sm text-gray-500 dark:text-gray-400 dark:text-gray-500">/ 5</span>
        </div>
        <div class="mt-2 flex items-center gap-0.5 text-amber-400">
            {% for i in range(5) %}
                {% if rating_avg and i < rating_avg|round(0, 'floor') %}
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118L10 13.347l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L3.567 7.82c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                {% else %}
                    <svg class="w-4 h-4 fill-current text-gray-200" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118L10 13.347l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L3.567 7.82c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                {% endif %}
            {% endfor %}
        </div>
    </div>

    <div class="bg-white dark:bg-[#111114] rounded-xl border border-gray-200 dark:border-gray-800 p-5">
        <div class="text-xs text-gray-500 dark:text-gray-400 dark:text-gray-500 uppercase tracking-wider font-semibold">Total reviews</div>
        <div class="text-3xl font-semibold text-gray-900 dark:text-gray-100 mt-2">{{ total_reviews }}</div>
    </div>

    <div class="bg-white dark:bg-[#111114] rounded-xl border border-gray-200 dark:border-gray-800 p-5">
        <div class="text-xs text-gray-500 dark:text-gray-400 dark:text-gray-500 uppercase tracking-wider font-semibold">5-star reviews</div>
        <div class="text-3xl font-semibold text-amber-500 mt-2">{{ five_star_count }}</div>
        <div class="mt-2 h-1.5 bg-gray-100 dark:bg-[#27272A] rounded-full overflow-hidden">
            <div class="h-full bg-amber-400 rounded-full" style="width: {{ five_star_pct }}%"></div>
        </div>
    </div>

    <div class="bg-white dark:bg-[#111114] rounded-xl border border-gray-200 dark:border-gray-800 p-5">
        <div class="text-xs text-gray-500 dark:text-gray-400 dark:text-gray-500 uppercase tracking-wider font-semibold">Needs response</div>
        <div class="text-3xl font-semibold text-orange-500 mt-2">{{ needs_response }}</div>
    </div>
</div>
