<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASIKO // Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { base: '#FBF9F6', deep: '#0D2A22', accent: '#D4AF37' } } } },
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .font-display { font-family: 'Playfair Display', Georgia, serif; }
        @keyframes adminFloat { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-14px) rotate(2deg); } }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulse-glow { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.5; } }
        .float-anim { animation: adminFloat 8s ease-in-out infinite; }
        .spin-slow { animation: spin-slow 30s linear infinite; }
        .pulse-glow { animation: pulse-glow 4s ease-in-out infinite; }
    </style>
</head>
<body class="bg-brand-deep min-h-screen font-sans text-white overflow-x-hidden">

    <div class="flex min-h-screen">
        <!-- Left side: decorative -->
        <div class="hidden lg:flex lg:w-1/2 bg-[#0A1F18] relative overflow-hidden items-center justify-center">
            <!-- Grid overlay -->
            <div class="absolute inset-0 opacity-[0.04]" style="background-image: linear-gradient(#D4AF37 1px, transparent 1px), linear-gradient(90deg, #D4AF37 1px, transparent 1px); background-size: 50px 50px;"></div>

            <!-- Floating elements -->
            <div class="relative w-full h-full">
                <!-- Large ring -->
                <div class="absolute top-1/4 left-1/3 spin-slow">
                    <div class="w-48 h-48 rounded-full border border-[#D4AF37]/15"></div>
                    <div class="absolute inset-4 rounded-full border border-[#D4AF37]/8"></div>
                    <div class="absolute inset-8 rounded-full border border-[#D4AF37]/5"></div>
                </div>

                <!-- Floating 3D images -->
                <div class="absolute top-[12%] right-[15%] float-anim w-36">
                    <img src="/static/images/icon-image/dress.png" alt="" class="w-full h-auto drop-shadow-2xl opacity-80" loading="lazy">
                    <div class="absolute -inset-6 rounded-full bg-[#D4AF37]/8 blur-2xl -z-10 pulse-glow"></div>
                </div>

                <div class="absolute bottom-[22%] left-[12%] float-anim w-32" style="animation-delay: 2s;">
                    <img src="/static/images/icon-image/black jacket.png" alt="" class="w-full h-auto drop-shadow-2xl opacity-80" loading="lazy">
                    <div class="absolute -inset-6 rounded-full bg-[#D4AF37]/8 blur-2xl -z-10 pulse-glow" style="animation-delay: 1.5s;"></div>
                </div>

                <div class="absolute top-[55%] right-[8%] float-anim w-28" style="animation-delay: 4s;">
                    <img src="/static/images/icon-image/necklace.png" alt="" class="w-full h-auto drop-shadow-2xl opacity-70" loading="lazy">
                </div>

                <!-- Center brand -->
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-12">
                    <div class="w-16 h-px bg-[#D4AF37]/30 mb-6"></div>
                    <span class="font-display text-5xl text-[#D4AF37] tracking-wider mb-3">ASIKO</span>
                    <p class="text-white/30 text-xs tracking-[0.35em] uppercase">Admin Panel</p>
                    <div class="w-16 h-px bg-[#D4AF37]/30 mt-6"></div>
                    <p class="text-white/20 text-xs mt-6 max-w-xs leading-relaxed">Manage your boutique. Track orders. Control inventory.</p>
                </div>

                <!-- Glowing orbs -->
                <div class="absolute top-[25%] left-[25%] w-40 h-40 bg-[#D4AF37]/5 rounded-full pulse-glow blur-3xl"></div>
                <div class="absolute bottom-[30%] right-[20%] w-32 h-32 bg-[#D4AF37]/8 rounded-full pulse-glow blur-2xl" style="animation-delay: 2s;"></div>
            </div>
        </div>

        <!-- Right side: form -->
        <div class="flex-1 min-h-screen lg:min-h-0 flex items-center justify-center px-4 sm:px-6 py-8 sm:py-12">
            <div class="w-full max-w-md mx-auto">
                <!-- Mobile brand -->
                <div class="text-center mb-8 lg:hidden">
                    <span class="font-display text-3xl tracking-wider text-[#D4AF37]">ASIKO</span>
                    <p class="text-[10px] text-white/30 mt-1 font-mono uppercase tracking-[0.3em]">Admin Panel</p>
                </div>

                <!-- Form card -->
                <div class="bg-white/5 backdrop-blur-xl rounded-2xl border border-white/10 p-5 sm:p-8 shadow-2xl">
                    <div class="mb-6 sm:mb-8">
                        <h1 class="font-display text-2xl text-white mb-1">Welcome back</h1>
                        <p class="text-sm text-white/40">Sign in to your admin dashboard.</p>
                    </div>

                    {% if error %}
                    <div class="bg-red-500/10 border border-red-500/20 text-red-400 text-sm px-4 py-3 rounded-xl mb-5 flex items-center gap-2">
                        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
                        {{ error }}
                    </div>
                    {% endif %}

                    {% if success %}
                    <div class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-sm px-4 py-3 rounded-xl mb-5 flex items-center gap-2">
                        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                        {{ success }}
                    </div>
                    {% endif %}

                    <form method="POST" action="/admin/login" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-white/50 mb-1.5">Email</label>
                            <input type="email" name="email" required
                                   class="w-full border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-[#D4AF37]/40 focus:border-[#D4AF37]/50 bg-white/5 transition-all placeholder:text-white/20"
                                   placeholder="zerupth@gmail.com">
                        </div>

                        <div x-data="{ show: false }">
                            <label class="block text-xs font-semibold text-white/50 mb-1.5">Password</label>
                            <div class="relative">
                                <input :type="show ? 'text' : 'password'" name="password" required
                                       class="w-full border border-white/10 rounded-xl px-4 py-3 pr-11 text-sm text-white focus:outline-none focus:ring-2 focus:ring-[#D4AF37]/40 focus:border-[#D4AF37]/50 bg-white/5 transition-all placeholder:text-white/20"
                                       placeholder="Your password">
                                <button type="button" @click="show = !show" class="absolute right-3 top-1/2 -translate-y-1/2 text-white/20 hover:text-white/50 transition-colors" tabindex="-1">
                                    <svg x-show="!show" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                    <svg x-show="show" x-cloak class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/></svg>
                                </button>
                            </div>
                        </div>

                        <button type="submit"
                                class="w-full bg-[#D4AF37] text-[#0D2A22] py-3.5 rounded-xl text-sm font-semibold hover:bg-[#D4AF37]/90 transition-all duration-200 shadow-lg shadow-[#D4AF37]/20 hover:shadow-xl hover:shadow-[#D4AF37]/30 mt-2">
                            Sign In to Dashboard
                        </button>
                    </form>
                </div>

                <!-- Back to store -->
                <p class="text-center text-sm text-white/30 mt-6 px-4">
                    <a href="/" class="text-[#D4AF37]/70 font-medium hover:text-[#D4AF37] transition-colors">&larr; Back to Store</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="asiko-toast" class="hidden fixed top-4 right-4 z-[9999] max-w-sm">
        <div class="bg-white/10 backdrop-blur-xl border border-white/10 rounded-xl shadow-2xl p-4 flex items-start gap-3">
            <div id="asiko-toast-icon" class="flex-shrink-0 mt-0.5"></div>
            <div class="flex-1 min-w-0">
                <p id="asiko-toast-title" class="text-sm font-semibold text-white"></p>
                <p id="asiko-toast-msg" class="text-xs text-white/50 mt-0.5"></p>
            </div>
            <button onclick="document.getElementById('asiko-toast').classList.add('hidden')" class="flex-shrink-0 text-white/30 hover:text-white/60">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
    </div>
    <script>
    function asikoToast(type, title, msg) {
        const t = document.getElementById('asiko-toast');
        const icon = document.getElementById('asiko-toast-icon');
        const titleEl = document.getElementById('asiko-toast-title');
        const msgEl = document.getElementById('asiko-toast-msg');
        if (type === 'success') {
            icon.innerHTML = '<div class="w-8 h-8 rounded-full bg-emerald-500/20 flex items-center justify-center"><svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg></div>';
        } else {
            icon.innerHTML = '<div class="w-8 h-8 rounded-full bg-red-500/20 flex items-center justify-center"><svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></div>';
        }
        titleEl.textContent = title;
        msgEl.textContent = msg;
        t.classList.remove('hidden');
        clearTimeout(window._asikoToastTimer);
        window._asikoToastTimer = setTimeout(() => t.classList.add('hidden'), 4000);
    }
    (function() {
        const params = new URLSearchParams(window.location.search);
        const success = params.get('success');
        const error = params.get('error');
        if (success) asikoToast('success', 'Success', decodeURIComponent(success));
        if (error) asikoToast('error', 'Error', decodeURIComponent(error));
        if (success || error) {
            const url = new URL(window.location);
            url.searchParams.delete('success');
            url.searchParams.delete('error');
            window.history.replaceState({}, '', url);
        }
    })();
    </script>
</body>
</html>
