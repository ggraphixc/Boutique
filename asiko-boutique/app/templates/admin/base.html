<!DOCTYPE html>
<html lang="en" class="h-full bg-[#FAFAFA] text-gray-900"
      x-data="{ sidebarOpen: true, sidebarCollapsed: false, darkMode: false }"
      x-init="
          sidebarOpen = (localStorage.getItem('asiko:sidebarOpen') ?? 'true') === 'true';
          darkMode = (localStorage.getItem('asiko:darkMode') ?? 'false') === 'true';
          $root.setAttribute('data-sidebar-open', sidebarOpen);
      "
      :class="{ 'sidebar-collapsed': !sidebarOpen, 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ÀSÌKÒ Atelier{% endblock %}</title>

    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        display: ['"Playfair Display"', 'Georgia', 'serif'],
                    },
                    colors: {
                        asiko: {
                            gold: '#D4AF37',
                            emerald: '#0D2A22',
                            cream: '#FBF9F6',
                            ink: '#050B0A',
                        }
                    },
                    boxShadow: {
                        'card': '0 1px 2px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.04)',
                        'card-hover': '0 4px 12px rgba(0,0,0,0.06), 0 2px 6px rgba(0,0,0,0.04)',
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .font-display { font-family: 'Playfair Display', Georgia, serif; }
        [x-cloak] { display: none !important; }

        /* Scrollbar */
        .panel-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .panel-scroll::-webkit-scrollbar-track { background: transparent; }
        .panel-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 99px; }
        .panel-scroll::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.24); }

        /* Skeleton */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton-loading {
            background: linear-gradient(90deg, rgba(0,0,0,0.04) 25%, rgba(0,0,0,0.08) 50%, rgba(0,0,0,0.04) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
        }

        /* HTMX */
        .htmx-request { opacity: 0.7; pointer-events: none; transition: opacity 200ms; }
        .htmx-indicator { opacity: 0; transition: opacity 200ms; }
        .htmx-request .htmx-indicator { opacity: 1; }

        /* Sidebar collapse */
        .sidebar-collapsed aside { width: 5rem !important; }
        .sidebar-collapsed .nav-label,
        .sidebar-collapsed .sidebar-header-text,
        .sidebar-collapsed .sidebar-section-label,
        .sidebar-collapsed .nav-badge,
        .sidebar-collapsed .sidebar-bottom-label,
        .sidebar-collapsed .sidebar-search-input { display: none !important; }
        .sidebar-collapsed aside .nav-item { justify-content: center; padding-left: 0; padding-right: 0; }
        .sidebar-collapsed aside .nav-item .nav-icon { margin: 0; }
        .sidebar-collapsed .sidebar-search { padding: 0.5rem; justify-content: center; }
        .sidebar-collapsed .sidebar-search-icon-only { display: flex !important; }
        .sidebar-collapsed .sidebar-header-block { padding: 1rem 0.5rem !important; justify-content: center; }

        /* Nav item */
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.625rem 0.875rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: rgb(75, 85, 99);
            transition: all 180ms;
            width: 100%;
            text-align: left;
            cursor: pointer;
            position: relative;
        }
        .nav-item:hover {
            background-color: rgb(243, 244, 246);
            color: rgb(17, 24, 39);
        }
        .nav-item.is-active {
            background-color: rgb(239, 246, 255); /* blue-50 */
            color: rgb(37, 99, 235); /* blue-600 */
            font-weight: 600;
        }
        .nav-item.is-active .nav-icon {
            background-color: transparent;
            color: rgb(37, 99, 235);
        }
        .nav-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.25rem;
            height: 1.25rem;
            color: rgb(107, 114, 128);
            flex-shrink: 0;
            transition: all 180ms;
        }
        .nav-item:hover .nav-icon { color: rgb(55, 65, 81); }
        .nav-badge {
            margin-left: auto;
            min-width: 1.25rem;
            height: 1.25rem;
            padding: 0 0.4rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6875rem;
            font-weight: 700;
            color: white;
            background-color: rgb(37, 99, 235);
            border-radius: 99px;
        }
        .nav-badge.is-neutral {
            background-color: rgb(229, 231, 235);
            color: rgb(75, 85, 99);
        }

        /* Workspace content */
        #workspace-content { animation: fadeIn 280ms ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    {% block head_extra %}{% endblock %}
</head>
<body class="h-full flex overflow-hidden antialiased">

    <!-- ============================================================== -->
    <!-- SIDEBAR (light-theme, single nav group, light-blue active)        -->
    <!-- ============================================================== -->
    <aside class="w-[260px] flex-shrink-0 bg-white border-r border-gray-200 flex flex-col h-full overflow-hidden transition-all duration-300">

        <!-- Brand header -->
        <div class="sidebar-header-block flex items-center gap-2.5 px-4 py-4 border-b border-gray-100">
            <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-gray-900 to-black flex items-center justify-center flex-shrink-0 shadow-sm">
                <span class="font-display text-base font-medium text-asiko-gold">À</span>
            </div>
            <div class="sidebar-header-text overflow-hidden flex-1">
                <div class="flex items-center gap-1.5">
                    <span class="font-semibold text-sm text-gray-900 truncate">ÀSÌKÒ Atelier</span>
                    <svg class="w-3.5 h-3.5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </div>
                <div class="text-[10px] uppercase tracking-[0.15em] text-gray-400 font-semibold">Pro Atelier</div>
            </div>
        </div>

        <!-- Search -->
        <div class="px-3 pt-3">
            <div class="sidebar-search relative flex items-center bg-gray-50 border border-gray-200 rounded-lg px-3 py-2">
                <svg class="w-4 h-4 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <input type="text" placeholder="Search..." class="sidebar-search-input w-full bg-transparent border-0 focus:outline-none focus:ring-0 text-sm text-gray-700 placeholder-gray-400 ml-2 px-0 py-0">
                <span class="sidebar-search-icon-only hidden items-center justify-center w-full"></span>
            </div>
        </div>

        <!-- Navigation (single group) -->
        <nav class="flex-1 overflow-y-auto panel-scroll px-3 py-5">
            <div class="space-y-0.5">

                <button hx-get="/admin/section/dashboard" hx-target="#workspace-content" hx-push-url="true"
                        id="nav-dashboard"
                        class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                    </svg>
                    <span class="nav-label">Dashboard</span>
                </button>

                <button hx-get="/admin/section/all-products" hx-target="#workspace-content" hx-push-url="true"
                        id="nav-sales"
                        class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span class="nav-label">Sales</span>
                    <span class="nav-badge" id="nav-badge-sales">3</span>
                </button>

                <a href="/" target="_blank" rel="noopener"
                        class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                    <span class="nav-label">View Site</span>
                </a>

                <button hx-get="/admin/section/products" hx-target="#workspace-content" hx-push-url="true"
                        id="nav-products"
                        class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                    </svg>
                    <span class="nav-label">Products</span>
                </button>

                <button hx-get="/admin/section/categories" hx-target="#workspace-content" hx-push-url="true"
                        id="nav-categories"
                        class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
                    </svg>
                    <span class="nav-label">Tags</span>
                </button>

                <button hx-get="/admin/section/reviews" hx-target="#workspace-content" hx-push-url="true"
                        id="nav-reviews"
                        class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                    </svg>
                    <span class="nav-label">Analytics</span>
                </button>

                <button hx-get="/admin/section/ads" hx-target="#workspace-content" hx-push-url="true"
                        id="nav-ads"
                        class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                    <span class="nav-label">Members</span>
                    <span class="nav-badge" id="nav-badge-ads">12</span>
                </button>

            </div>

            <!-- ACCOUNT divider -->
            <div class="mt-7 pt-5 border-t border-gray-100">
                <div class="sidebar-section-label text-[10px] uppercase tracking-[0.15em] text-gray-400 font-bold px-3 mb-2">Account</div>
                <div class="space-y-0.5">

                    <button hx-get="/admin/section/settings" hx-target="#workspace-content" hx-push-url="true"
                            id="nav-settings"
                            class="nav-item">
                        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        <span class="nav-label">Settings</span>
                    </button>

                    <button hx-get="/admin/section/about" hx-target="#workspace-content" hx-push-url="true"
                            id="nav-about"
                            class="nav-item">
                        <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <span class="nav-label">About Me</span>
                    </button>

                </div>
            </div>
        </nav>

        <!-- Bottom: Help & Support + Hide -->
        <div class="flex-shrink-0 border-t border-gray-100 px-3 py-3 space-y-1">
            <a href="/admin/help" class="nav-item">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span class="sidebar-bottom-label nav-label">Help & Support</span>
            </a>
            <button @click="sidebarOpen = !sidebarOpen; localStorage.setItem('asiko:sidebarOpen', sidebarOpen); $root.setAttribute('data-sidebar-open', sidebarOpen); document.documentElement.classList.toggle('sidebar-collapsed', !sidebarOpen)"
                    class="nav-item w-full">
                <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" :d="sidebarOpen ? 'M11 19l-7-7 7-7' : 'M13 5l7 7-7 7M3 5l7 7-7 7'"/>
                </svg>
                <span class="sidebar-bottom-label" x-text="sidebarOpen ? 'Hide' : 'Show'">Hide</span>
            </button>
        </div>
    </aside>

    <!-- ============================================================== -->
    <!-- MAIN WORKSPACE                                                    -->
    <!-- ============================================================== -->
    <main id="workspace"
          hx-trigger="load"
          hx-get="/admin/section/dashboard"
          hx-indicator="#workspace-indicator"
          class="flex-1 flex flex-col overflow-hidden bg-[#FAFAFA] relative"
          role="main"
          aria-label="Admin workspace">

        <!-- Loading bar -->
        <div id="workspace-indicator" class="htmx-indicator fixed top-0 left-[260px] right-0 h-0.5 z-50 bg-transparent overflow-hidden">
            <div class="h-full w-full bg-asiko-gold origin-left scale-x-0 transition-transform duration-500 ease-out htmx-request:scale-x-100"></div>
        </div>

        <!-- Top bar: right-side icons only -->
        <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-end gap-2 flex-shrink-0">
            <button class="w-9 h-9 rounded-lg bg-gray-900 text-white flex items-center justify-center hover:bg-gray-800 transition-colors" title="Source code">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
                </svg>
            </button>
            <button class="w-9 h-9 rounded-lg hover:bg-gray-100 text-gray-600 flex items-center justify-center transition-colors" title="Bookmark">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                </svg>
            </button>
            <button class="w-9 h-9 rounded-lg hover:bg-gray-100 text-gray-600 flex items-center justify-center transition-colors" title="More">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                    <circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>
                </svg>
            </button>
            <div class="w-px h-6 bg-gray-200 mx-1"></div>
            <button class="relative w-9 h-9 rounded-lg hover:bg-gray-100 text-gray-600 flex items-center justify-center transition-colors" title="Notifications">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                </svg>
                <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-rose-500 rounded-full ring-2 ring-white"></span>
            </button>
            <button @click="darkMode = !darkMode; localStorage.setItem('asiko:darkMode', darkMode); $root.classList.toggle('dark', darkMode)"
                    class="w-9 h-9 rounded-lg hover:bg-gray-100 text-gray-600 flex items-center justify-center transition-colors" title="Toggle theme">
                <svg x-show="!darkMode" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
                <svg x-show="darkMode" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" x-cloak>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
            </button>
            <div class="w-px h-6 bg-gray-200 mx-1"></div>
            <button class="flex items-center gap-2 pl-1 pr-2 py-1 rounded-lg hover:bg-gray-100 transition-colors" title="Profile">
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-gray-900 to-black flex items-center justify-center text-white text-xs font-semibold flex-shrink-0">
                    {{ (request.session.get('owner_name') or 'A')[:1] | upper }}
                </div>
                <span class="text-sm font-medium text-gray-700 hidden md:inline">{{ request.session.get('owner_name') or 'Admin' }}</span>
            </button>
        </header>

        <!-- Content area (HTMX swaps sections here) -->
        <div class="flex-1 overflow-y-auto panel-scroll">
            <div class="p-6 md:p-8" id="workspace-content">
                <!-- HTMX content renders here -->
            </div>
        </div>
    </main>

    <!-- ============================================================== -->
    <!-- GLOBAL JS                                                        -->
    <!-- ============================================================== -->
    <script>
        // Active nav highlight (light-theme: light-blue active)
        const PAGE_META = {
            'nav-dashboard':    { title: 'Dashboard' },
            'nav-sales':        { title: 'Sales' },
            'nav-products':     { title: 'Products' },
            'nav-categories':   { title: 'Tags' },
            'nav-reviews':      { title: 'Analytics' },
            'nav-ads':          { title: 'Members' },
            'nav-settings':     { title: 'Settings' },
            'nav-about':        { title: 'About Me' },
        };

        function setActiveNav(triggerId) {
            if (!triggerId || !triggerId.startsWith('nav-')) return;
            document.querySelectorAll('aside .nav-item').forEach(btn => btn.classList.remove('is-active'));
            const trigger = document.getElementById(triggerId);
            if (trigger) trigger.classList.add('is-active');
        }

        // Initial active state from URL
        (function() {
            const path = window.location.pathname;
            const match = path.match(/\/admin\/section\/(\w[\w-]*)/);
            const idMap = {
                'dashboard': 'nav-dashboard', 'products': 'nav-products',
                'categories': 'nav-categories', 'all-products': 'nav-sales',
                'reviews': 'nav-reviews', 'ads': 'nav-ads',
                'settings': 'nav-settings', 'about': 'nav-about',
            };
            if (match && idMap[match[1]]) {
                setActiveNav(idMap[match[1]]);
            } else {
                setActiveNav('nav-dashboard');
            }
        })();

        document.addEventListener('htmx:afterSwap', (e) => {
            const triggerId = e.detail?.elt?.id;
            setActiveNav(triggerId);
            const ws = document.getElementById('workspace');
            if (ws) ws.scrollTo({ top: 0, behavior: 'smooth' });
            window.dispatchEvent(new CustomEvent('asiko:section-loaded', { detail: { path: e.detail?.path?.requestPath } }));
        });

        document.addEventListener('htmx:responseError', (e) => {
            console.error('[Admin] HTMX request failed:', e.detail);
        });
    </script>

    {% block body_extra %}{% endblock %}
</body>
</html>
