<!DOCTYPE html>
<html lang="en" class="h-full bg-[#FAFAFA] text-gray-900"
      x-data="{ sidebarOpen: true, sidebarCollapsed: false, darkMode: false }"
      x-init="
          sidebarOpen = (localStorage.getItem('asiko:sidebarOpen') ?? 'true') === 'true';
          darkMode = (localStorage.getItem('asiko:admin:darkMode') ?? 'false') === 'true';
          $root.setAttribute('data-sidebar-open', sidebarOpen);
      "
      :class="{ 'sidebar-collapsed': !sidebarOpen, 'dark': darkMode }">
<head>
    <script>
        // Apply persisted theme synchronously to prevent FOUC.
        (function() {
            try {
                if ((localStorage.getItem('asiko:admin:darkMode') ?? 'false') === 'true') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ÀSÌKÒ Atelier{% endblock %}</title>

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/ws.js"></script>
    <script defer src="https://unpkg.com/@alpinejs/collapse@3.14.3/dist/cdn.min.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        display: ['"Playfair Display"', 'Georgia', 'serif'],
                    },
                    colors: {
                        asiko: {
                            gold: '#D4AF37',
                            emerald: '#0D2A22',
                            cream: '#FBF9F6',
                            ink: '#050B0A',
                        }
                    },
                    boxShadow: {
                        'card': '0 1px 2px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.04)',
                        'card-hover': '0 4px 12px rgba(0,0,0,0.06), 0 2px 6px rgba(0,0,0,0.04)',
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .font-display { font-family: 'Playfair Display', Georgia, serif; }
        [x-cloak] { display: none !important; }

        /* Scrollbar */
        .panel-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .panel-scroll::-webkit-scrollbar-track { background: transparent; }
        .panel-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 99px; }
        .panel-scroll::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.24); }

        /* Skeleton */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton-loading {
            background: linear-gradient(90deg, rgba(0,0,0,0.04) 25%, rgba(0,0,0,0.08) 50%, rgba(0,0,0,0.04) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
        }

        /* HTMX */
        .htmx-request { opacity: 0.7; pointer-events: none; transition: opacity 200ms; }
        .htmx-indicator { opacity: 0; transition: opacity 200ms; }
        .htmx-request .htmx-indicator { opacity: 1; }

        /* Sidebar collapse */
        .sidebar-collapsed aside { width: 5rem !important; }
        .sidebar-collapsed .nav-label,
        .sidebar-collapsed .sidebar-header-text,
        .sidebar-collapsed .sidebar-section-label,
        .sidebar-collapsed .nav-badge,
        .sidebar-collapsed .sidebar-bottom-label,
        .sidebar-collapsed .sidebar-search-input { display: none !important; }
        .sidebar-collapsed aside .nav-item { justify-content: center; padding-left: 0; padding-right: 0; }
        .sidebar-collapsed aside .nav-item .nav-icon { margin: 0; }
        .sidebar-collapsed .sidebar-search { padding: 0.5rem; justify-content: center; }
        .sidebar-collapsed .sidebar-search-icon-only { display: flex !important; }
        .sidebar-collapsed .sidebar-header-block { padding: 1rem 0.5rem !important; justify-content: center; }

        /* Nav item */
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.625rem 0.875rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: rgb(75, 85, 99);
            transition: all 180ms;
            width: 100%;
            text-align: left;
            cursor: pointer;
            position: relative;
        }
        .dark .nav-item { color: rgb(161, 161, 170); }
        .nav-item:hover {
            background-color: rgb(243, 244, 246);
            color: rgb(17, 24, 39);
        }
        .dark .nav-item:hover {
            background-color: rgb(39, 39, 42);
            color: rgb(244, 244, 245);
        }
        .nav-item.is-active {
            background-color: rgb(239, 246, 255); /* blue-50 */
            color: rgb(37, 99, 235); /* blue-600 */
            font-weight: 600;
        }
        .dark .nav-item.is-active {
            background-color: rgba(37, 99, 235, 0.12);
            color: rgb(96, 165, 250); /* blue-400 */
        }
        .nav-item.is-active .nav-icon {
            background-color: transparent;
            color: rgb(37, 99, 235);
        }
        .dark .nav-item.is-active .nav-icon { color: rgb(96, 165, 250); }
        .nav-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.25rem;
            height: 1.25rem;
            color: rgb(107, 114, 128);
            flex-shrink: 0;
            transition: all 180ms;
        }
        .dark .nav-icon { color: rgb(161, 161, 170); }
        .nav-item:hover .nav-icon { color: rgb(55, 65, 81); }
        .dark .nav-item:hover .nav-icon { color: rgb(228, 228, 231); }

        /* Sidebar bottom links (Help & Support, Hide/Show) */
        .nav-item.sidebar-bottom-link { color: rgb(107, 114, 128); }
        .dark .nav-item.sidebar-bottom-link { color: rgb(161, 161, 170); }
        .nav-item.sidebar-bottom-link:hover { color: rgb(17, 24, 39); }
        .dark .nav-item.sidebar-bottom-link:hover { color: rgb(244, 244, 245); }

        /* Account divider */
        .sidebar-section-label { color: rgb(156, 163, 175); }
        .dark .sidebar-section-label { color: rgb(113, 113, 122); }

        /* Workspace content */
        #workspace-content { animation: fadeIn 280ms ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Dark-mode component overrides (Tailwind utilities can't reach inside
           dynamic HTMX-swapped section fragments consistently, so we paint the
           most common surfaces via CSS variables that all section templates use). */
        .dark .panel-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); }
        .dark .panel-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.24); }

        .dark .surface-card {
            background-color: rgb(17, 17, 19);
            border-color: rgb(39, 39, 42);
        }
        .dark .surface-card:hover { border-color: rgb(63, 63, 70); }

        .dark .surface-text-strong { color: rgb(244, 244, 245); }
        .dark .surface-text-muted { color: rgb(161, 161, 170); }
        .dark .surface-text-faint { color: rgb(113, 113, 122); }
        .nav-badge {
            margin-left: auto;
            min-width: 1.25rem;
            height: 1.25rem;
            padding: 0 0.4rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6875rem;
            font-weight: 700;
            color: white;
            background-color: rgb(37, 99, 235);
            border-radius: 99px;
        }
        .nav-badge.is-neutral {
            background-color: rgb(229, 231, 235);
            color: rgb(75, 85, 99);
        }

        /* Workspace content */
        #workspace-content { animation: fadeIn 280ms ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    {% block head_extra %}{% endblock %}
</head>
<body class="h-full flex antialiased bg-[#FAFAFA] dark:bg-[#0B0B0D] text-gray-900 dark:text-gray-100 lg:overflow-hidden">

    <!-- Mobile sidebar overlay -->
    <div id="admin-sidebar-overlay" class="fixed inset-0 z-40 bg-black/40 backdrop-blur-sm hidden lg:hidden" onclick="toggleAdminSidebar(false)"></div>

    <!-- ============================================================== -->
    <!-- SIDEBAR (light-theme, single nav group, light-blue active)        -->
    <!-- ============================================================== -->
    <aside id="admin-sidebar" class="fixed z-50 lg:static lg:z-auto inset-y-0 left-0 w-[260px] flex-shrink-0 bg-white dark:bg-[#111114] border-r border-gray-200 dark:border-gray-800 flex flex-col h-full overflow-hidden transition-all duration-300 -translate-x-full lg:translate-x-0">

        <!-- Brand header -->
        <div class="sidebar-header-block flex items-center gap-2.5 px-4 py-4 border-b border-gray-100 dark:border-gray-800">
            <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-gray-900 to-black flex items-center justify-center flex-shrink-0 shadow-sm overflow-hidden">
                <img src="/static/images/icon-image/dress.png" alt="" class="w-7 h-7 object-cover">
            </div>
            <div class="sidebar-header-text overflow-hidden flex-1">
                <div class="flex items-center gap-1.5">
                    <span class="font-semibold text-sm text-gray-900 dark:text-gray-100 truncate">ÀSÌKÒ Atelier</span>
                    <svg class="w-3.5 h-3.5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </div>
                <div class="text-[10px] uppercase tracking-[0.15em] text-gray-400 font-semibold">Pro Plan</div>
            </div>
        </div>

        <!-- Search -->
        <div class="px-3 pt-3">
            <div class="sidebar-search relative flex items-center bg-gray-50 dark:bg-[#18181B] border border-gray-200 dark:border-gray-700 rounded-lg px-3 py-2">
                <svg class="w-4 h-4 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <input type="text" placeholder="Search..." class="sidebar-search-input w-full bg-transparent border-0 focus:outline-none focus:ring-0 text-sm text-gray-700 dark:text-gray-200 placeholder-gray-400 ml-2 px-0 py-0">
                <span class="sidebar-search-icon-only hidden items-center justify-center w-full"></span>
            </div>
        </div>

        <!-- Navigation (single group) -->
        <nav class="flex-1 overflow-y-auto panel-scroll px-3 py-5">
            <div class="space-y-0.5">

                <button hx-get="/admin/section/dashboard" hx-target="#workspace-content" hx-push-url="true"
                        id="nav-dashboard"
                        class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                    </svg>
                    <span class="nav-label">Dashboard</span>
                </button>

                <button hx-get="/admin/section/sales" hx-target="#workspace-content" hx-push-url="true"
                        id="nav-sales"

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>

                        class="nav-item">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>

                    <span class="nav-label">Members</span>
                    <span class="nav-badge hidden" id="nav-badge-members">0</span>
                </button>

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>

    <script>
        // Mobile sidebar toggle
        function toggleAdminSidebar(open) {
            const sidebar = document.getElementById('admin-sidebar');
            const overlay = document.getElementById('admin-sidebar-overlay');
            if (open) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        // Close sidebar on nav click (mobile)
        document.querySelectorAll('aside .nav-item').forEach(btn => {
            btn.addEventListener('click', () => {
                if (window.innerWidth < 1024) toggleAdminSidebar(false);
            });
        });

        // Active nav highlight (light-theme: light-blue active)
        const PAGE_META = {
            'nav-dashboard':    { title: 'Dashboard' },
            'nav-sales':        { title: 'Sales' },
            'nav-view-site':    { title: 'View Site' },
            'nav-products':     { title: 'Products' },
            'nav-categories':   { title: 'Tags' },
            'nav-analytics':    { title: 'Analytics' },
            'nav-members':      { title: 'Members' },
            'nav-operations':   { title: 'Operations' },
            'nav-logistics':    { title: 'Logistics' },
            'nav-social':       { title: 'Social' },
                'nav-loyalty':      { title: 'Loyalty' },
                'nav-ai-training':  { title: 'AI Stylist' },
                'nav-pages':        { title: 'Pages' },
                'nav-email':        { title: 'Email Center' },
                'nav-settings':     { title: 'Settings' },
                'nav-about':        { title: 'About Me' },
        };

        function setActiveNav(triggerId) {
            if (!triggerId || !triggerId.startsWith('nav-')) return;
            document.querySelectorAll('aside .nav-item').forEach(btn => btn.classList.remove('is-active'));
            const trigger = document.getElementById(triggerId);
            if (trigger) trigger.classList.add('is-active');
        }

        function setActiveNavFromPath(path) {
            const match = path && path.match(/\/admin\/section\/([\w-]+)/);
            if (!match) return;
            const slug = match[1];
            const idMap = {
                'dashboard':  'nav-dashboard',
                'sales':      'nav-sales',
                'view-site':  'nav-view-site',
                'products':   'nav-products',
                'categories': 'nav-categories',
                'analytics':  'nav-analytics',
                'members':    'nav-members',
                'operations': 'nav-operations',
                'logistics':  'nav-logistics',
                'social':     'nav-social',
                'loyalty':    'nav-loyalty',
                'ai-training': 'nav-ai-training',
                'pages':       'nav-pages',
                'settings':   'nav-settings',
                'about':      'nav-about',
            };
            if (idMap[slug]) setActiveNav(idMap[slug]);
        }

        // Initial active state from URL
        (function() {
            setActiveNavFromPath(window.location.pathname);
            if (!document.querySelector('aside .nav-item.is-active')) {
                setActiveNav('nav-dashboard');
            }
        })();

        document.addEventListener('htmx:afterSwap', (e) => {
            // Extract nav from request path, not the swapped element ID
            const path = e.detail?.path?.requestPath || e.detail?.xhr?.responseURL || '';
            setActiveNavFromPath(path);
            const ws = document.getElementById('workspace');
            if (ws) ws.scrollTo({ top: 0, behavior: 'smooth' });
            window.dispatchEvent(new CustomEvent('asiko:section-loaded', { detail: { path: path } }));
        });

        document.addEventListener('htmx:responseError', (e) => {
            console.error('[Admin] HTMX request failed:', e.detail);
        });
    </script>

    <!-- ASIKO Confirm Dialog (21st.dev style) -->
    <script>
        function asikoConfirm() {
            return {
                visible: false, title: '', message: '', confirmText: 'Continue', danger: false,
                _resolve: null,
                show(title, message, opts = {}) {
                    this.title = title; this.message = message;
                    this.confirmText = opts.confirmText || 'Continue';
                    this.danger = opts.danger || false;
                    this.visible = true;
                    return new Promise(r => { this._resolve = r; });
                },
                confirm() { this.visible = false; if (this._resolve) this._resolve(true); },
                cancel() { this.visible = false; if (this._resolve) this._resolve(false); },
            };
        }
        window.asikoConfirm = function(title, message, opts) {
            const el = document.getElementById('asiko-confirm');
            if (el && el._x_dataStack) return el._x_dataStack[0].show(title, message, opts);
            return Promise.resolve(false);
        };
        /* Helper: async confirm for HTMX buttons. Usage: onclick="asikoConfirm(...).then(r => { if(r) htmx.trigger(...) })" */
        window.asikoConfirm = window.asikoConfirm || function(title, msg, opts) {
            var el = document.getElementById('asiko-confirm');
            if (el && el._x_dataStack) return el._x_dataStack[0].show(title, msg, opts);
            return Promise.resolve(false);
        };
    </script>
    <div id="asiko-confirm" class="fixed inset-0 z-[9999] hidden" x-data="asikoConfirm()" x-show="visible" x-cloak>
        <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" @click="cancel()"></div>
        <div class="absolute inset-0 flex items-center justify-center p-4">
            <div x-show="visible" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95"

                        <svg class="w-6 h-6 text-amber-600 dark:text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-900 dark:text-gray-100 mb-1" x-text="title"></h3>
                    <p class="text-sm text-gray-500 dark:text-gray-400" x-text="message"></p>
                </div>
                <div class="flex border-t border-gray-100 dark:border-gray-800">
                    <button @click="cancel()" class="flex-1 px-4 py-3 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors">
                        Cancel
                    </button>
                    <div class="w-px bg-gray-100 dark:bg-gray-800"></div>
                    <button @click="confirm()" class="flex-1 px-4 py-3 text-sm font-medium transition-colors"
                            :class="danger ? 'text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20' : 'text-[#0D2A22] dark:text-[#D4AF37] hover:bg-gray-50 dark:hover:bg-gray-800/50'">

    <!-- Universal toast notification -->
    <div id="asiko-toast" class="hidden fixed top-4 right-4 z-[9999] max-w-sm">
        <div class="bg-white dark:bg-[#111114] border border-gray-200 dark:border-gray-800 rounded-xl shadow-2xl p-4 flex items-start gap-3">
            <div id="asiko-toast-icon" class="flex-shrink-0 mt-0.5"></div>

            </div>
            <button onclick="document.getElementById('asiko-toast').classList.add('hidden')" class="flex-shrink-0 text-gray-400 hover:text-gray-600">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>

    <script>
    function asikoToast(type, title, msg) {
        const t = document.getElementById('asiko-toast');
        const icon = document.getElementById('asiko-toast-icon');
        const titleEl = document.getElementById('asiko-toast-title');
        const msgEl = document.getElementById('asiko-toast-msg');
        if (type === 'success') {
            icon.innerHTML = '<div class="w-8 h-8 rounded-full bg-emerald-100 dark:bg-emerald-900/30 flex items-center justify-center"><svg class="w-4 h-4 text-emerald-600 dark:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg></div>';
        } else if (type === 'warning') {
            icon.innerHTML = '<div class="w-8 h-8 rounded-full bg-amber-100 dark:bg-amber-900/30 flex items-center justify-center"><svg class="w-4 h-4 text-amber-600 dark:text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg></div>';
        } else {
            icon.innerHTML = '<div class="w-8 h-8 rounded-full bg-red-100 dark:bg-red-900/30 flex items-center justify-center"><svg class="w-4 h-4 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></div>';
        }
        titleEl.textContent = title;
        msgEl.textContent = msg;
        t.classList.remove('hidden');
        clearTimeout(window._asikoToastTimer);
        window._asikoToastTimer = setTimeout(() => t.classList.add('hidden'), 4000);
    }
    /* Auto-show toast from query params */
    (function() {
        const params = new URLSearchParams(window.location.search);
        const success = params.get('success');
        const error = params.get('error');
        if (success) asikoToast('success', 'Success', decodeURIComponent(success));
        if (error) asikoToast('error', 'Error', decodeURIComponent(error));
        if (success || error) {
            const url = new URL(window.location);
            url.searchParams.delete('success');
            url.searchParams.delete('error');
            window.history.replaceState({}, '', url);
        }
    })();
    /* Auto-toast on HTMX section POST responses */
    document.body.addEventListener('htmx:afterRequest', function(e) {
        if (e.detail.requestConfig?.verb === 'POST' && e.detail.pathInfo?.requestPath?.startsWith('/admin/section/')) {
            if (e.detail.successful) {
                asikoToast('success', 'Saved', 'Changes saved successfully.');
            } else {
                asikoToast('error', 'Error', 'Something went wrong. Please try again.');
            }
        }
    });
    </script>
