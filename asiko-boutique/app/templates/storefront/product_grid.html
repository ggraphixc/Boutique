{% for product in products %}
<a href="/product/{{ product.id }}" class="group block overflow-hidden rounded-xl border border-[#D4AF37]/20 dark:border-gray-700 bg-white dark:bg-[#18181B] shadow-sm transition-all duration-300 hover:shadow-lg hover:scale-[1.02]">
    <div class="relative aspect-square bg-[#FBF9F6] dark:bg-[#111] overflow-hidden">
        {% if product.base_image %}
        <img src="{{ product.base_image }}" alt="{{ product.name }}" class="w-full h-full object-cover object-center transition-transform duration-700 group-hover:scale-105" loading="lazy">
        {% else %}
        <div class="absolute inset-0 bg-gradient-to-br from-[#0D2A22]/5 to-[#D4AF37]/10"></div>
        <div class="absolute inset-0 flex items-center justify-center text-[#0D2A22]/30 dark:text-white/10"><span class="font-display text-5xl">A</span></div>
        {% endif %}
        {% if product.has_3d_model %}
        <span class="absolute top-3 left-3 z-10 inline-flex items-center gap-1 px-2 py-1 rounded-md bg-[#D4AF37]/90 text-[#0D2A22] text-[9px] font-mono font-bold uppercase tracking-wider shadow-lg">
            <span class="relative flex h-1.5 w-1.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#0D2A22] opacity-60"></span>
                <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-[#0D2A22]"></span>
            </span>
            3D
        </span>
        {% endif %}
    </div>
    <div class="p-4">
        <h3 class="font-display text-lg text-[#0D2A22] dark:text-gray-100 mb-2 group-hover:text-[#D4AF37] transition-colors">{{ product.name }}</h3>
        <p class="text-sm text-[#1A1A1A]/70 dark:text-gray-400 mb-3 line-clamp-2">{{ product.description }}</p>
        <div class="flex items-center justify-between mb-4">
            <span class="text-xl font-semibold text-[#0D2A22] dark:text-[#D4AF37]">{{ product.price|naira }}</span>
            <span class="text-xs text-[#1A1A1A]/50 dark:text-gray-500">{{ product.stock_quantity }} in stock</span>
        </div>
        <form hx-post="/cart/add" hx-target="#cart-badge" hx-swap="outerHTML" onclick="event.preventDefault(); event.stopPropagation(); document.getElementById('cart-drawer').classList.remove('hidden')">
            <input type="hidden" name="product_id" value="{{ product.id }}">
            <button type="submit" class="w-full inline-flex items-center justify-center gap-1 px-3 py-2 text-sm font-medium text-white bg-[#0D2A22] dark:bg-[#D4AF37] dark:text-[#0D2A22] rounded-md hover:bg-[#0D2A22]/90 dark:hover:bg-[#E6C875] transition-colors">Add to Cart</button>
        </form>
    </div>
</a>
{% endfor %}
