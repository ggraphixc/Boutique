{% for product in products %}
<div class="group overflow-hidden rounded-xl border border-[#D4AF37]/20 bg-white shadow-sm transition-all duration-300 hover:shadow-lg hover:scale-[1.02]">
    <div class="relative aspect-square bg-[#FBF9F6] overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-br from-[#0D2A22]/5 to-[#D4AF37]/10"></div>
        <div class="absolute inset-0 flex items-center justify-center text-[#0D2A22]/30"><span class="font-display text-5xl">A</span></div>
        {% if product.has_3d_model %}
        <a href="/virtual-experience"
           class="absolute top-3 left-3 z-10 inline-flex items-center gap-1 px-2 py-1 rounded-md bg-[#D4AF37]/90 text-[#0D2A22] text-[9px] font-mono font-bold uppercase tracking-wider shadow-lg hover:bg-[#D4AF37] transition-all duration-300 group-hover:scale-105"
           title="View in 3D Virtual Atelier">
            <span class="relative flex h-1.5 w-1.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#0D2A22] opacity-60"></span>
                <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-[#0D2A22]"></span>
            </span>
            3D
        </a>
        {% endif %}
    </div>
    <div class="p-4">
        <h3 class="font-display text-lg text-[#0D2A22] mb-2">{{ product.name }}</h3>
        <p class="text-sm text-[#1A1A1A]/70 mb-3 line-clamp-2">{{ product.description }}</p>
        <div class="flex items-center justify-between mb-4">
            <span class="text-xl font-semibold text-[#0D2A22]">{{ product.price|naira }}</span>
            <span class="text-xs text-[#1A1A1A]/50">{{ product.stock_quantity }} in stock</span>
        </div>
        <form hx-post="/cart/add" hx-target="#cart-badge" hx-swap="outerHTML" onclick="document.getElementById('cart-drawer').classList.remove('hidden')">
            <input type="hidden" name="product_id" value="{{ product.id }}">
            <button type="submit" class="w-full inline-flex items-center justify-center gap-1 px-3 py-2 text-sm font-medium text-white bg-[#0D2A22] rounded-md hover:bg-[#0D2A22]/90 transition-colors">Add to Cart</button>
        </form>
    </div>
</div>
{% endfor %}
